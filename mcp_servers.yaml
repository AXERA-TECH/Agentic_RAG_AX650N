# MCP Server Configuration
# ──────────────────────────
# Add as many servers as you need under the "servers" key.
# Each server needs at least "command" and "args".
#
# Supported fields per server:
#   command   — executable to launch (required)
#   args      — command-line arguments (space-separated string)
#   env       — extra environment variables (optional, key: value map)

servers:
  # ── Example: Filesystem access ─────────────────────
  # filesystem:
  #   command: npx
  #   args: -y @modelcontextprotocol/server-filesystem /tmp

  # ── Example: GitHub API ────────────────────────────
  # github:
  #   command: npx
  #   args: -y @modelcontextprotocol/server-github
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: ghp_xxxxxxxxxxxx

  # ── Example: PostgreSQL database ───────────────────
  # postgres:
  #   command: npx
  #   args: -y @modelcontextprotocol/server-postgres postgresql://localhost/mydb

  # ── Example: Brave Search ──────────────────────────
  # brave:
  #   command: npx
  #   args: -y @modelcontextprotocol/server-brave-search
  #   env:
  #     BRAVE_API_KEY: your-api-key-here

  # ── Example: Python-based MCP server ───────────────
  # custom_tool:
  #   command: python
  #   args: -m my_mcp_server --port 9000
