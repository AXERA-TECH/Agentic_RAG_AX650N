<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG 整体架构</title>
  <desc id="desc">展示客户端接入、聊天编排、请求策略、知识检索、外部媒体服务，以及数据与运行时状态。</desc>
  <style>
    text {
      font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
      text-rendering: optimizeLegibility;
    }
    .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 16px; font-weight: 500; fill: #475569; }
    .section-title { font-size: 21px; font-weight: 700; fill: #172033; }
    .section-en { font-size: 12px; font-weight: 600; fill: #64748b; }
    .section-no { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .node-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .node-sub { font-size: 13px; font-weight: 500; fill: #475569; }
    .small { font-size: 13px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 12px; font-weight: 500; fill: #475569; }
    .pill { font-size: 13px; font-weight: 700; }
    .edge-label { font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1500" fill="#f8fafc"/>
  <rect x="40" y="28" width="1360" height="92" rx="18" fill="url(#header-gradient)" stroke="#dbeafe"/>
  <circle cx="82" cy="74" r="22" fill="#2563eb"/>
  <path d="M70 74h24M82 62v24" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="68" class="title">Agentic RAG 整体架构</text>
  <text x="118" y="94" class="subtitle">统一接入、策略路由、检索执行、多模态服务与状态存储</text>

  <!-- Layer backgrounds -->
  <rect x="40" y="145" width="1360" height="300" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
  <rect x="40" y="470" width="1360" height="365" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
  <rect x="40" y="860" width="1360" height="340" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
  <rect x="40" y="1225" width="1360" height="210" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>

  <!-- Layer labels -->
  <circle cx="75" cy="181" r="17" fill="#2563eb"/><text x="75" y="186" text-anchor="middle" class="section-no">1</text>
  <text x="104" y="187" class="section-title">客户端与接入层</text><text x="1260" y="185" class="section-en">CLIENT &amp; ACCESS</text>
  <circle cx="75" cy="506" r="17" fill="#7c3aed"/><text x="75" y="511" text-anchor="middle" class="section-no">2</text>
  <text x="104" y="512" class="section-title">请求策略与执行层</text><text x="1230" y="510" class="section-en">POLICY &amp; EXECUTION</text>
  <circle cx="75" cy="896" r="17" fill="#059669"/><text x="75" y="901" text-anchor="middle" class="section-no">3</text>
  <text x="104" y="902" class="section-title">能力与服务层</text><text x="1180" y="900" class="section-en">CAPABILITIES &amp; SERVICES</text>
  <circle cx="75" cy="1261" r="17" fill="#ea580c"/><text x="75" y="1266" text-anchor="middle" class="section-no">4</text>
  <text x="104" y="1267" class="section-title">数据与运行时状态</text><text x="1240" y="1265" class="section-en">DATA &amp; RUNTIME</text>

  <!-- Access arrows -->
  <path d="M315 245 H380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M315 315 H345 V265 H380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M315 385 H345 V354 H380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M620 255 H800 V280 H980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M620 344 H800 V330 H980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M930 244 H955 V292 H980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M930 326 H980" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M1180 305 H1210" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <path d="M1295 360 V470" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- Client cards -->
  <g>
    <rect x="85" y="218" width="230" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="116" cy="245" r="13" fill="#dbeafe"/><path d="M109 240h14v10h-14zM112 253h8" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <text x="143" y="251" class="node-title">Web UI</text>
    <rect x="85" y="288" width="230" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="116" cy="315" r="13" fill="#dbeafe"/><text x="116" y="320" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">SDK</text>
    <text x="143" y="321" class="node-title">SDK 客户端</text>
    <rect x="85" y="358" width="230" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="116" cy="385" r="13" fill="#dbeafe"/><path d="M109 385h14M116 378v14" stroke="#2563eb" stroke-width="1.7"/>
    <text x="143" y="391" class="node-title">WebSocket</text>
  </g>

  <!-- Access endpoints -->
  <g>
    <rect x="380" y="218" width="240" height="74" rx="11" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="500" y="249" text-anchor="middle" class="node-title">REST Chat API</text>
    <text x="500" y="274" text-anchor="middle" class="node-sub">HTTP / SSE 聊天入口</text>
    <rect x="380" y="307" width="240" height="74" rx="11" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="500" y="338" text-anchor="middle" class="node-title">ChatCapability</text>
    <text x="500" y="363" text-anchor="middle" class="node-sub">多模态消息预处理</text>
  </g>

  <!-- Other gateways -->
  <g>
    <rect x="680" y="218" width="250" height="52" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="805" y="250" text-anchor="middle" class="node-title">企业微信 / QQ / 钉钉网关</text>
    <rect x="680" y="300" width="250" height="52" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="805" y="332" text-anchor="middle" class="node-title">CLI Chat</text>
  </g>

  <!-- Orchestrator and router -->
  <g filter="url(#shadow)"><rect x="980" y="255" width="200" height="100" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/></g>
  <text x="1080" y="297" text-anchor="middle" class="node-title">ChatOrchestrator</text>
  <text x="1080" y="326" text-anchor="middle" class="node-sub">Turn / Context / Memory</text>
  <g filter="url(#shadow)"><rect x="1210" y="245" width="170" height="115" rx="18" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/></g>
  <text x="1295" y="292" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">AgentRouter</text>
  <text x="1295" y="321" text-anchor="middle" font-size="13" font-weight="500" fill="#ede9fe">选择最小执行路径</text>

  <!-- Policy fan-out arrows -->
  <path d="M1270 540 V585 H170 V640" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M1270 540 V585 H435 V640" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M1270 540 V585 H700 V640" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M1270 540 V585 H965 V640" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M1270 540 V640" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="1115" y="493" width="310" height="47" rx="23" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1270" y="523" text-anchor="middle" class="node-title">RequestPolicy</text>

  <!-- Strategy cards -->
  <g>
    <rect x="65" y="640" width="210" height="145" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="105" cy="680" r="19" fill="#e2e8f0"/><path d="M105 667v14l9 6" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="140" y="684" class="node-title">Local</text>
    <text x="85" y="725" class="node-sub">本地日期计算</text>
    <text x="85" y="750" class="tiny">不调用 LLM / 工具</text>

    <rect x="330" y="640" width="210" height="145" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="370" cy="680" r="19" fill="#dbeafe"/><path d="M363 675h14M363 681h10M363 687h12" stroke="#2563eb" stroke-width="1.7"/>
    <text x="405" y="684" class="node-title">Direct</text>
    <text x="350" y="725" class="node-sub">LLM 直接回答</text>
    <text x="350" y="750" class="tiny">含图片输入</text>

    <rect x="595" y="640" width="210" height="145" rx="13" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="635" cy="680" r="19" fill="#dcfce7"/><path d="M626 681h18M630 675l-5 6 5 6M640 675l5 6-5 6" fill="none" stroke="#059669" stroke-width="1.7"/>
    <text x="670" y="684" class="node-title">RAG</text>
    <text x="615" y="720" class="node-sub">知识库单次检索</text>
    <text x="615" y="745" class="tiny">无证据回退 MCP</text>

    <rect x="860" y="640" width="210" height="145" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="900" cy="680" r="19" fill="#ffedd5"/><path d="M890 681h20M900 671v20" stroke="#ea580c" stroke-width="1.7"/>
    <text x="935" y="684" class="node-title">MCP Search</text>
    <text x="880" y="725" class="node-sub">单次外部搜索</text>
    <text x="880" y="750" class="tiny">获取实时信息</text>

    <rect x="1125" y="640" width="250" height="145" rx="13" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <circle cx="1165" cy="680" r="19" fill="#ede9fe"/><path d="M1155 680c7-12 19-5 18 3-1 8-13 10-18 1" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
    <text x="1200" y="684" class="node-title">Agent Loop</text>
    <text x="1145" y="720" class="node-sub">ReAct 多步循环</text>
    <text x="1145" y="745" class="tiny">RAG + 至多一个 MCP 工具</text>
  </g>

  <!-- Strategy to capabilities arrows -->
  <path d="M700 785 V900 H460 V935" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M1250 785 V875 H720 V935" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M965 785 V900 H1110 V935" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M1250 785 V855 H1260 V935" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M435 785 V840 H1040 V1010" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>

  <!-- Knowledge capability panel -->
  <rect x="65" y="935" width="810" height="225" rx="15" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="95" y="973" class="node-title">知识检索与入库</text>
  <rect x="95" y="995" width="350" height="135" rx="11" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="120" y="1025" class="pill" fill="#047857">rag_search → HybridRetriever</text>
  <text x="120" y="1053" class="small">Dense Vector → Milvus Lite</text>
  <text x="120" y="1079" class="small">BM25 / FTS5 → SQLite</text>
  <text x="120" y="1105" class="small">Knowledge Graph（可选）→ RRF</text>
  <rect x="470" y="995" width="375" height="135" rx="11" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="495" y="1025" class="pill" fill="#047857">Upload / Ingest</text>
  <rect x="495" y="1050" width="72" height="35" rx="17" fill="#ecfdf5" stroke="#86efac"/><text x="531" y="1073" text-anchor="middle" class="tiny">Parse</text>
  <path d="M567 1067h44" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="611" y="1050" width="82" height="35" rx="17" fill="#ecfdf5" stroke="#86efac"/><text x="652" y="1073" text-anchor="middle" class="tiny">Process</text>
  <path d="M693 1067h44" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="737" y="1050" width="78" height="35" rx="17" fill="#ecfdf5" stroke="#86efac"/><text x="776" y="1073" text-anchor="middle" class="tiny">Index</text>
  <text x="495" y="1110" class="node-sub">多模态内容统一进入 ContentList</text>

  <!-- External services panel -->
  <rect x="915" y="935" width="460" height="225" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="945" y="973" class="node-title">外部与媒体服务</text>
  <rect x="945" y="995" width="400" height="42" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="965" y="1022" class="pill" fill="#c2410c">MCP Server</text><text x="1075" y="1022" class="node-sub">启动时连接 · 外部搜索</text>
  <rect x="945" y="1048" width="400" height="42" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="965" y="1075" class="pill" fill="#c2410c">图片输入</text><text x="1075" y="1075" class="node-sub">Vision LLM</text>
  <rect x="945" y="1101" width="190" height="42" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="965" y="1128" class="pill" fill="#c2410c">语音输入</text><text x="1040" y="1128" class="node-sub">STT → Chat</text>
  <rect x="1150" y="1101" width="195" height="42" rx="9" fill="#ffffff" stroke="#fed7aa"/>
  <text x="1170" y="1128" class="pill" fill="#c2410c">回答输出</text><text x="1248" y="1128" class="node-sub">TTS 可选</text>

  <!-- Writes to data layer -->
  <path d="M470 1160 V1225" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <path d="M1145 1160 V1225" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>

  <!-- Data stores -->
  <g>
    <rect x="70" y="1300" width="300" height="100" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="110" cy="1338" r="19" fill="#e2e8f0"/><path d="M100 1338h20M104 1331h12M104 1345h12" stroke="#475569" stroke-width="1.7"/>
    <text x="145" y="1342" class="node-title">内存</text>
    <text x="90" y="1373" class="node-sub">短期记忆 · 工作记忆</text>
    <text x="90" y="1393" class="tiny">Turn 状态 · StreamBus</text>

    <rect x="400" y="1300" width="300" height="100" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <ellipse cx="440" cy="1331" rx="20" ry="7" fill="#dbeafe" stroke="#2563eb"/><path d="M420 1331v22c0 5 9 7 20 7s20-2 20-7v-22M420 1342c0 5 9 7 20 7s20-2 20-7" fill="#dbeafe" stroke="#2563eb"/>
    <text x="475" y="1342" class="node-title">SQLite</text>
    <text x="420" y="1373" class="node-sub">会话 · 消息 · 平台映射</text>
    <text x="420" y="1393" class="tiny">FTS5 / BM25 全文索引</text>

    <rect x="730" y="1300" width="300" height="100" rx="13" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <ellipse cx="770" cy="1331" rx="20" ry="7" fill="#ede9fe" stroke="#7c3aed"/><path d="M750 1331v22c0 5 9 7 20 7s20-2 20-7v-22M750 1342c0 5 9 7 20 7s20-2 20-7M758 1352h24" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="805" y="1342" class="node-title">Milvus Lite</text>
    <text x="750" y="1373" class="node-sub">Dense Vector</text>
    <text x="750" y="1393" class="tiny">文本 / 多模态向量索引</text>

    <rect x="1060" y="1300" width="310" height="100" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <path d="M1095 1318h30l10 10v34h-40zM1125 1318v10h10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="1160" y="1342" class="node-title">JSON 与文件</text>
    <text x="1160" y="1373" class="node-sub">知识图谱 · 文件元数据</text>
    <text x="1160" y="1393" class="tiny">workspace/uploads 上传文件</text>
  </g>

  <!-- Legend -->
  <g transform="translate(70 1465)">
    <text x="0" y="0" class="tiny" font-weight="700">图例</text>
    <line x1="38" y1="-4" x2="72" y2="-4" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="82" y="0" class="tiny">接入/调用</text>
    <line x1="168" y1="-4" x2="202" y2="-4" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="212" y="0" class="tiny">路由/策略</text>
    <line x1="298" y1="-4" x2="332" y2="-4" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/><text x="342" y="0" class="tiny">知识能力</text>
    <line x1="428" y1="-4" x2="462" y2="-4" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="472" y="0" class="tiny">外部服务</text>
    <line x1="558" y1="-4" x2="592" y2="-4" stroke="#64748b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/><text x="602" y="0" class="tiny">状态写入</text>
  </g>
</svg>
