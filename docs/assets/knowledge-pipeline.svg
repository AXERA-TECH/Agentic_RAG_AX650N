<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG 知识管线</title>
  <desc id="desc">展示多模态内容从解析、统一表示、模态处理到知识图谱、全文索引和向量索引，以及查询阶段的混合检索和 RRF 融合流程。</desc>
  <style>
    text {
      font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", "SimHei", sans-serif;
      text-rendering: optimizeLegibility;
    }
    .title { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 16px; font-weight: 500; fill: #475569; }
    .section-title { font-size: 21px; font-weight: 700; fill: #172033; }
    .section-no { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .node-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
    .node-sub { font-size: 13px; font-weight: 500; fill: #475569; }
    .small { font-size: 13px; font-weight: 500; fill: #334155; }
    .tiny { font-size: 12px; font-weight: 500; fill: #475569; }
    .pill { font-size: 13px; font-weight: 700; }
    .edge-label { font-size: 12px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1300" fill="#f8fafc"/>
  <rect x="40" y="28" width="1360" height="92" rx="18" fill="url(#header-gradient)" stroke="#dbeafe"/>
  <circle cx="82" cy="74" r="22" fill="#2563eb"/>
  <path d="M71 75h22M82 64v22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="68" class="title">Agentic RAG 知识管线</text>
  <text x="118" y="94" class="subtitle">多模态入库、混合索引与 Dense / BM25 / Graph 融合检索</text>

  <!-- Section backgrounds -->
  <rect x="40" y="145" width="1360" height="570" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>
  <rect x="40" y="740" width="1360" height="480" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="1.5"/>

  <!-- Section labels -->
  <circle cx="75" cy="181" r="17" fill="#2563eb"/>
  <text x="75" y="186" text-anchor="middle" class="section-no">1</text>
  <text x="104" y="187" class="section-title">入库与索引</text>
  <text x="1270" y="185" class="tiny">INGEST &amp; INDEX</text>

  <circle cx="75" cy="776" r="17" fill="#059669"/>
  <text x="75" y="781" text-anchor="middle" class="section-no">2</text>
  <text x="104" y="782" class="section-title">检索与融合</text>
  <text x="1280" y="780" class="tiny">RETRIEVE &amp; FUSE</text>

  <!-- Ingestion primary arrows, drawn before nodes -->
  <path d="M290 312 H365" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M585 312 H660" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M880 312 H955" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="327" y="300" text-anchor="middle" class="edge-label" fill="#2563eb">读取</text>
  <text x="622" y="300" text-anchor="middle" class="edge-label" fill="#2563eb">标准化</text>
  <text x="917" y="300" text-anchor="middle" class="edge-label" fill="#2563eb">模态处理</text>

  <!-- Input node -->
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="200" height="154" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <path d="M148 253h32l12 12v48h-44z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M180 253v12h12" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="340" text-anchor="middle" class="node-title">输入内容</text>
  <text x="190" y="365" text-anchor="middle" class="node-sub">文本 · 图片 · 音频 · 视频</text>
  <text x="190" y="383" text-anchor="middle" class="node-sub">PDF · Office</text>

  <!-- Parse node -->
  <g filter="url(#shadow)">
    <rect x="365" y="235" width="220" height="154" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  </g>
  <circle cx="475" cy="274" r="21" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <path d="M465 274h20M475 264v20" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <text x="475" y="326" text-anchor="middle" class="node-title">Parse / 输入解析</text>
  <text x="475" y="353" text-anchor="middle" class="node-sub">文档解析 · OCR</text>
  <text x="475" y="374" text-anchor="middle" class="node-sub">文件识别 · 媒体分类</text>

  <!-- ContentList node -->
  <g filter="url(#shadow)">
    <rect x="660" y="235" width="220" height="154" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>
  <rect x="738" y="252" width="64" height="42" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M749 264h42M749 274h42M749 284h28" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <text x="770" y="326" text-anchor="middle" class="node-title">ContentList</text>
  <text x="770" y="353" text-anchor="middle" class="node-sub">统一内容表示</text>
  <text x="770" y="374" text-anchor="middle" class="node-sub">ContentItem + 元数据</text>

  <!-- Process node -->
  <g filter="url(#shadow)">
    <rect x="955" y="235" width="390" height="154" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  </g>
  <text x="1150" y="270" text-anchor="middle" class="node-title">Process / 模态处理</text>
  <g>
    <rect x="982" y="293" width="78" height="58" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="1021" y="316" text-anchor="middle" class="pill" fill="#0f766e">文本</text>
    <text x="1021" y="337" text-anchor="middle" class="tiny">分块</text>
    <rect x="1068" y="293" width="78" height="58" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="1107" y="316" text-anchor="middle" class="pill" fill="#0f766e">图片</text>
    <text x="1107" y="337" text-anchor="middle" class="tiny">描述</text>
    <rect x="1154" y="293" width="78" height="58" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="1193" y="316" text-anchor="middle" class="pill" fill="#0f766e">视频</text>
    <text x="1193" y="337" text-anchor="middle" class="tiny">关键帧</text>
    <rect x="1240" y="293" width="78" height="58" rx="8" fill="#ffffff" stroke="#99f6e4"/>
    <text x="1279" y="316" text-anchor="middle" class="pill" fill="#0f766e">音频</text>
    <text x="1279" y="337" text-anchor="middle" class="tiny">转写</text>
  </g>

  <!-- Index fanout arrows -->
  <path d="M1150 389 V435 H275 V480" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M1150 389 V435 H720 V480" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M1150 389 V480" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="656" y="421" width="128" height="27" rx="13" fill="#ecfdf5"/>
  <text x="720" y="439" text-anchor="middle" class="edge-label" fill="#047857">Index / 索引阶段</text>

  <!-- Index cards -->
  <g>
    <rect x="95" y="480" width="360" height="172" rx="13" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="132" cy="517" r="20" fill="#dcfce7" stroke="#16a34a"/>
    <circle cx="125" cy="513" r="4" fill="#16a34a"/>
    <circle cx="139" cy="509" r="4" fill="#16a34a"/>
    <circle cx="140" cy="524" r="4" fill="#16a34a"/>
    <path d="M128 512l7-2M128 516l8 6M139 513l1 7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="165" y="515" class="node-title">① KG Builder</text>
    <text x="165" y="538" class="node-sub">enable_kg 时抽取实体与关系</text>
    <path d="M112 563h326" stroke="#bbf7d0"/>
    <text x="112" y="588" class="small">输出</text>
    <rect x="157" y="570" width="205" height="30" rx="15" fill="#ffffff" stroke="#86efac"/>
    <text x="260" y="590" text-anchor="middle" class="pill" fill="#15803d">knowledge_graph.json</text>
    <text x="112" y="625" class="tiny">为检索阶段提供实体语义邻居扩展</text>
  </g>

  <g>
    <rect x="540" y="480" width="360" height="172" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <ellipse cx="580" cy="511" rx="21" ry="8" fill="#dbeafe" stroke="#2563eb"/>
    <path d="M559 511v27c0 5 9 8 21 8s21-3 21-8v-27M559 524c0 5 9 8 21 8s21-3 21-8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="620" y="515" class="node-title">② SQLite FTS5</text>
    <text x="620" y="538" class="node-sub">文本倒排索引</text>
    <path d="M557 563h326" stroke="#bfdbfe"/>
    <text x="557" y="589" class="pill" fill="#1d4ed8">BM25 全文检索</text>
    <text x="557" y="615" class="tiny">使用查询文本计算关键词相关性</text>
  </g>

  <g>
    <rect x="985" y="480" width="360" height="172" rx="13" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <ellipse cx="1025" cy="511" rx="21" ry="8" fill="#ede9fe" stroke="#7c3aed"/>
    <path d="M1004 511v27c0 5 9 8 21 8s21-3 21-8v-27M1004 524c0 5 9 8 21 8s21-3 21-8M1011 535h28" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="1065" y="515" class="node-title">③ Embedding</text>
    <text x="1065" y="538" class="node-sub">文本或多模态向量化</text>
    <path d="M1002 563h326" stroke="#e9d5ff"/>
    <text x="1002" y="589" class="pill" fill="#6d28d9">Milvus Lite</text>
    <text x="1002" y="615" class="tiny">存储向量并提供 Dense 相似度检索</text>
  </g>

  <!-- Retrieval arrows -->
  <path d="M275 862 H360" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M275 894 H310 V922 H615 V974 H670" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M590 858 H670" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <path d="M900 858 H965 V880 H1010" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow-purple)"/>
  <path d="M900 974 H965 V900 H1010" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M1150 926 V962" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="318" y="850" text-anchor="middle" class="edge-label" fill="#2563eb">查询文本/图片</text>
  <text x="450" y="946" text-anchor="middle" class="edge-label" fill="#059669">查询文本</text>
  <text x="630" y="846" text-anchor="middle" class="edge-label" fill="#7c3aed">查询向量</text>
  <text x="930" y="962" text-anchor="middle" class="edge-label" fill="#059669">BM25</text>

  <!-- Retrieval nodes -->
  <g filter="url(#shadow)">
    <rect x="90" y="817" width="185" height="116" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <circle cx="182" cy="840" r="14" fill="#dbeafe"/>
  <path d="M177 840h10M182 835v10" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="182" y="872" text-anchor="middle" class="node-title">查询输入</text>
  <text x="182" y="897" text-anchor="middle" class="node-sub">文本</text>
  <text x="182" y="918" text-anchor="middle" class="node-sub">可选查询图片</text>

  <g>
    <rect x="360" y="810" width="230" height="96" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="475" y="846" text-anchor="middle" class="node-title">Query Embedding</text>
    <text x="475" y="874" text-anchor="middle" class="node-sub">生成查询向量</text>
  </g>

  <g>
    <rect x="670" y="926" width="230" height="96" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="785" y="962" text-anchor="middle" class="node-title">SQLite BM25</text>
    <text x="785" y="990" text-anchor="middle" class="node-sub">关键词全文匹配</text>
  </g>

  <g>
    <rect x="670" y="810" width="230" height="96" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="785" y="846" text-anchor="middle" class="node-title">Milvus Dense</text>
    <text x="785" y="874" text-anchor="middle" class="node-sub">向量相似度召回</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="850" width="280" height="76" rx="38" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="1150" y="883" text-anchor="middle" class="node-title">初次 RRF 融合</text>
  <text x="1150" y="906" text-anchor="middle" class="node-sub">Dense + BM25</text>

  <!-- KG branch area -->
  <path d="M1150 1038 V1080 H790 V1110" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M1150 1038 V1110" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="1050" y="962" width="200" height="76" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="1080" cy="1000" r="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1080" y="1006" text-anchor="middle" font-size="18" font-weight="700" fill="#ea580c">?</text>
  <text x="1170" y="1006" text-anchor="middle" class="node-title">是否启用 KG？</text>
  <text x="930" y="1070" class="edge-label" fill="#4b5563">否：去重 / 过滤</text>
  <text x="1164" y="1070" class="edge-label" fill="#ea580c">是：图扩展</text>

  <g>
    <rect x="650" y="1110" width="280" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="790" y="1140" text-anchor="middle" class="node-title">去重与过滤</text>
    <text x="790" y="1164" text-anchor="middle" class="node-sub">保留融合候选</text>
  </g>

  <g>
    <rect x="980" y="1110" width="360" height="72" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="1160" y="1138" text-anchor="middle" class="node-title">候选实体语义邻居扩展</text>
    <text x="1160" y="1162" text-anchor="middle" class="node-sub">Dense + BM25 + Graph 再次 RRF</text>
  </g>

  <!-- Final convergence -->
  <path d="M790 1182 V1203 H1000" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M1160 1182 V1203 H1000" fill="none" stroke="#ea580c" stroke-width="2"/>
  <path d="M1000 1203 V1232" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="835" y="1232" width="330" height="48" rx="24" fill="#2563eb" stroke="#1d4ed8"/>
  </g>
  <text x="1000" y="1263" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Top-K 上下文</text>

  <!-- Legend -->
  <g transform="translate(70 1250)">
    <text x="0" y="0" class="tiny" font-weight="700">图例</text>
    <line x1="38" y1="-4" x2="72" y2="-4" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <text x="82" y="0" class="tiny">主数据流</text>
    <line x1="154" y1="-4" x2="188" y2="-4" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="198" y="0" class="tiny">向量转换</text>
    <line x1="278" y1="-4" x2="312" y2="-4" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="322" y="0" class="tiny">索引/检索</text>
    <line x1="396" y1="-4" x2="430" y2="-4" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="440" y="0" class="tiny">图谱扩展</text>
  </g>
</svg>
