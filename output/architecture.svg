<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <style>
    text {
      font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      text-rendering: geometricPrecision;
      shape-rendering: geometricPrecision;
    }
    .layer { fill:#f8fafc; stroke:#d8e0ea; stroke-width:1.5; stroke-dasharray:7 4; }
    .layer-title { fill:#475569; font-size:14px; font-weight:700; letter-spacing:.06em; }
    .title { fill:#111827; font-size:28px; font-weight:700; }
    .node-title { fill:#111827; font-size:16px; font-weight:700; }
    .sub { fill:#475569; font-size:13px; }
    .small { fill:#334155; font-size:12px; }
    .edge,.tool-edge,.data-edge,.control-edge { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .edge { stroke:#2563eb; stroke-width:1.7; marker-end:url(#arrow-blue); }
    .tool-edge { stroke:#7c3aed; stroke-width:1.7; marker-end:url(#arrow-purple); }
    .data-edge { stroke:#16a34a; stroke-width:1.7; marker-end:url(#arrow-green); }
    .control-edge { stroke:#ea580c; stroke-width:1.6; marker-end:url(#arrow-orange); }
    .edge-label { fill:#334155; font-size:12px; font-weight:600; paint-order:stroke; stroke:#f8fafc; stroke-width:6px; stroke-linejoin:round; }
  </style>
  <defs>
    <!-- Open chevron arrowheads remain legible in dense junctions. -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity=".09"/></filter>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" class="title">Agentic RAG 整体架构</text>
  <text x="600" y="56" text-anchor="middle" class="sub">统一接入 · 双路径执行 · Retrieval-first ReAct · 多模态混合检索</text>

  <!-- Access -->
  <rect x="24" y="76" width="1152" height="132" rx="10" class="layer"/>
  <text x="42" y="98" class="layer-title">客户端与接入层</text>
  <rect x="48" y="116" width="182" height="68" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="139" y="142" text-anchor="middle" class="node-title">客户端</text>
  <text x="139" y="163" text-anchor="middle" class="sub">Web UI · CLI · SDK</text>
  <rect x="282" y="116" width="222" height="68" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="393" y="142" text-anchor="middle" class="node-title">API 与流式通道</text>
  <text x="393" y="163" text-anchor="middle" class="sub">REST / SSE · WebSocket</text>
  <rect x="556" y="116" width="222" height="68" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="667" y="142" text-anchor="middle" class="node-title">消息平台网关</text>
  <text x="667" y="163" text-anchor="middle" class="sub">企业微信 · QQ Bot · 钉钉</text>
  <rect x="830" y="108" width="310" height="84" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
  <text x="985" y="137" text-anchor="middle" class="node-title">ChatOrchestrator</text>
  <text x="985" y="158" text-anchor="middle" class="sub">UnifiedContext · TurnManager</text>
  <text x="985" y="176" text-anchor="middle" class="sub">StreamBus · 短期记忆写入</text>
  <path d="M230 150 H278" class="edge"/>
  <path d="M504 150 H804 V128 H826" class="edge"/>
  <path d="M778 166 H804 V174 H826" class="tool-edge"/>

  <!-- Runtime -->
  <rect x="24" y="228" width="1152" height="200" rx="10" class="layer"/>
  <text x="42" y="250" class="layer-title">策略、执行与模型层</text>
  <rect x="48" y="274" width="230" height="118" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="163" y="302" text-anchor="middle" class="node-title">AgentRouter</text>
  <text x="163" y="324" text-anchor="middle" class="sub">RequestPolicy</text>
  <rect x="68" y="342" width="82" height="32" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="109" y="362" text-anchor="middle" class="small" font-weight="700">DIRECT</text>
  <rect x="168" y="342" width="90" height="32" rx="16" fill="#ffedd5" stroke="#fdba74"/>
  <text x="213" y="362" text-anchor="middle" class="small" font-weight="700">TOOL_USE</text>

  <rect x="334" y="274" width="250" height="118" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="459" y="302" text-anchor="middle" class="node-title">SinglePassEngine</text>
  <text x="459" y="327" text-anchor="middle" class="sub">确定性日期计算</text>
  <text x="459" y="348" text-anchor="middle" class="sub">闲聊 / 写作 / 翻译</text>
  <text x="459" y="369" text-anchor="middle" class="sub">图片 → Vision LLM</text>

  <rect x="640" y="262" width="300" height="142" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text x="790" y="291" text-anchor="middle" class="node-title">Retrieval-first ReActEngine</text>
  <text x="790" y="322" text-anchor="middle" class="sub">固定先检索 · 按需调用工具</text>
  <text x="790" y="346" text-anchor="middle" class="sub">证据门控 · 最多 6 轮</text>
  <text x="790" y="374" text-anchor="middle" class="small">Function Calling / 文本 ReAct</text>

  <rect x="996" y="274" width="144" height="118" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1068" y="302" text-anchor="middle" class="node-title">LLM Provider</text>
  <text x="1068" y="328" text-anchor="middle" class="sub">OpenAI</text>
  <text x="1068" y="352" text-anchor="middle" class="sub">OpenAI-compatible</text>

  <path d="M985 192 V216 H300 V258 H163 V270" class="edge"/>
  <path d="M278 316 H316 V333 H330" class="edge"/>
  <text x="304" y="307" text-anchor="middle" class="edge-label">DIRECT</text>
  <path d="M278 374 H306 V414 H610 V370 H636" class="control-edge"/>
  <text x="458" y="410" text-anchor="middle" class="edge-label">TOOL_USE</text>
  <path d="M940 333 H992" class="edge"/>

  <!-- Tools and knowledge -->
  <rect x="24" y="448" width="1152" height="236" rx="10" class="layer"/>
  <text x="42" y="470" class="layer-title">工具、知识检索与媒体服务</text>
  <rect x="48" y="492" width="140" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="118" y="518" text-anchor="middle" class="node-title">rag_search</text>
  <text x="118" y="538" text-anchor="middle" class="sub">内置 L1 Tool</text>
  <rect x="238" y="492" width="180" height="60" rx="8" fill="#fff7ed" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="328" y="518" text-anchor="middle" class="node-title">HybridRetriever</text>
  <text x="328" y="538" text-anchor="middle" class="sub">RRF 融合 · Top-K</text>
  <rect x="48" y="586" width="140" height="62" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="118" y="612" text-anchor="middle" class="node-title">Dense Vector</text>
  <text x="118" y="633" text-anchor="middle" class="sub">Milvus Lite</text>
  <rect x="238" y="586" width="140" height="62" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="308" y="612" text-anchor="middle" class="node-title">BM25 / FTS5</text>
  <text x="308" y="633" text-anchor="middle" class="sub">SQLite</text>
  <rect x="428" y="586" width="140" height="62" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="498" y="612" text-anchor="middle" class="node-title">Knowledge Graph</text>
  <text x="498" y="633" text-anchor="middle" class="sub">JSON · 可选</text>

  <rect x="632" y="492" width="180" height="60" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="722" y="518" text-anchor="middle" class="node-title">MCP Tool Registry</text>
  <text x="722" y="538" text-anchor="middle" class="sub">启动时注册全部工具</text>
  <rect x="862" y="492" width="180" height="60" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="952" y="518" text-anchor="middle" class="node-title">MCP Servers</text>
  <text x="952" y="538" text-anchor="middle" class="sub">stdio 外部进程</text>
  <rect x="632" y="586" width="410" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="837" y="612" text-anchor="middle" class="node-title">媒体服务</text>
  <text x="837" y="633" text-anchor="middle" class="sub">Vision LLM · STT → Chat → TTS</text>

  <path d="M720 404 V438 H118 V488" class="edge"/>
  <path d="M860 404 V462 H722 V488" class="tool-edge"/>
  <path d="M188 522 H234" class="edge"/>
  <path d="M328 552 V568 H118 V582" class="data-edge"/>
  <path d="M328 552 V582" class="data-edge"/>
  <path d="M328 552 V568 H498 V582" class="data-edge"/>
  <path d="M862 522 H816" class="tool-edge"/>

  <!-- Ingest and data -->
  <rect x="24" y="704" width="1152" height="126" rx="10" class="layer"/>
  <text x="42" y="726" class="layer-title">入库流水线与持久化</text>
  <rect x="48" y="750" width="346" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="221" y="773" text-anchor="middle" class="node-title">Upload / Ingest</text>
  <text x="221" y="792" text-anchor="middle" class="sub">Parse → ContentList → Process → Index</text>
  <rect x="444" y="750" width="200" height="54" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="544" y="773" text-anchor="middle" class="node-title">SQLite</text>
  <text x="544" y="792" text-anchor="middle" class="sub">会话 · 消息 · FTS5</text>
  <rect x="694" y="750" width="200" height="54" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="794" y="773" text-anchor="middle" class="node-title">Milvus Lite</text>
  <text x="794" y="792" text-anchor="middle" class="sub">Dense Vector</text>
  <rect x="944" y="750" width="196" height="54" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="1042" y="773" text-anchor="middle" class="node-title">workspace/</text>
  <text x="1042" y="792" text-anchor="middle" class="sub">KG · 元数据 · uploads</text>
  <path d="M221 750 V720 H308 V652" class="data-edge"/>

  <!-- Note -->
  <text x="1140" y="870" text-anchor="end" class="small">事实型答案必须通过有效证据门控</text>
</svg>
